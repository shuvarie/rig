[package]
name = "rig"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT"
readme = "README.md"
description = "An opinionated library for building LLM powered applications."
repository = "https://github.com/0xPlaygrounds/rig"
# Examples now live in their own packages under `examples/*`; don't auto-discover
# them as examples of this crate.
autoexamples = false
# This manifest is both the workspace root and the `rig` facade package, so the
# package directory is the whole repository and `cargo package` sweeps it: CI
# workflows, README artwork, the Nix flake, release tooling, `examples/` data
# and a `tests/` tree that cannot compile from the tarball at all. The facade's
# own source is one file of re-exports.
#
# An allowlist, not an exclude list (#2349): "not shipped" is the safe default,
# so this does not need extending every time the repository grows a directory,
# and it is the only form that keeps out untracked-but-unignored files - cargo
# packages whatever happens to be lying next to the manifest at publish time.
#
# NOTE: this is [package].include and must stay ABOVE the [workspace] header.
# Below it, it parses as `workspace.include` and is ignored with only an
# unused-key warning. The `exclude` further down is [workspace].exclude, which
# is member discovery - a different key. `include` and `exclude` cannot coexist
# on [package]: `include` wins and `exclude` goes inert.
#
# Patterns need the leading `/`. Cargo's globs are gitignore-style and match at
# any depth, so an unanchored "README.md" would also pull in
# `examples/README.md` and `tests/README.md`.
#
# LICENSE must be listed explicitly: `license = "MIT"` is an SPDX expression,
# not `license-file`, so cargo does not add the file on its own.
#
# Packaging emits a `warning: ignoring test 'x'` line per test target. Do NOT
# silence those with `autotests = false`: that stops local discovery too, and a
# test target discovered nowhere runs in no CI job.
include = [
    "/src/**",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/MIGRATING.md",
    # Referenced by README.md, which registries render from the tarball. The
    # other five img/ files are referenced by nothing and stay out.
    "/img/rig-rebranded-logo-white.svg",
    "/img/rig-rebranded-logo-black.svg",
    "/img/built-by-playgrounds.svg",
    "/img/ryzome-bg.png",
]

# docs.rs builds with a current nightly, on which `surrealdb`'s `diskann`
# dependency does not compile, so every feature but `surrealdb` is documented.
# Keep the list covering every other feature in the manifest.
[package.metadata.docs.rs]
features = [
    "agent",
    "audio",
    "bedrock",
    "candle",
    "derive",
    "epub",
    "fastembed",
    "fastembed-hf-hub",
    "fastembed-ort-download-binaries",
    "gemini-grpc",
    "helixdb",
    "image",
    "lancedb",
    "memory",
    "milvus",
    "mongodb",
    "native-tls",
    "neo4j",
    "pdf",
    "postgres",
    "qdrant",
    "reqwest",
    "reqwest-middleware",
    "reqwest-middleware-native-tls",
    "reqwest-middleware-rustls",
    "rmcp",
    "rustls",
    "s3vectors",
    "scylladb",
    "socks",
    "sqlite",
    "test-utils",
    "typesafeai",
    "vectorize",
    "vertexai",
    "websocket",
    "websocket-native-tls",
    "websocket-rustls",
]
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
resolver = "3"
members = [
    ".",
    # The examples are unpublished packages of their own; each `publish = false`.
    "examples/*",
]
exclude = [
    # Data/infra dirs under examples/ that are not Cargo packages.
    "examples/documents",
    "examples/otel",
]
# A bare `cargo nextest run` resolves the default set, and every `crates/*`
# unit test once ran in no CI step because nothing named it (#2258). The
# library is the default member; the examples stay opt-in.
default-members = ["."]

[workspace.lints.clippy]
dbg_macro = "forbid"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
expect_used = "deny"
expect_fun_call = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "forbid"
unimplemented = "forbid"
unreachable = "deny"
unwrap_used = "deny"

# Size and shape heuristics, not correctness: in this tree each one only ever
# produced a suppression, a box inside a public enum variant, or a type alias
# that shortened a signature instead of naming a concept.
large_enum_variant = "allow"
result_large_err = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
should_implement_trait = "allow"

# Line tables keep file and line numbers in backtraces of workspace code while
# emitting far less debuginfo, so linking the test binaries is faster.
[profile.dev]
debug = "line-tables-only"

# Dependency debuginfo dominates the target directory and link time, and
# dependency frames are rarely read. DEVELOPING.md shows how to restore it.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
opt-level = "s"


[workspace.package]
version = "0.46.0"
edition = "2024"
# The toolchain in rust-toolchain.toml, the only one CI builds with.
rust-version = "1.97.1"

[workspace.dependencies]
# Every requirement below is a FLOOR, not a pin: `tokio = "1"` means `^1`,
# and a downstream resolves anywhere inside that range — usually to whatever
# its own lockfile already holds. So each floor is the lowest version rig's
# own code needs, to the best it can be verified: a bare major (or `0.minor`)
# where rig uses only long-stable API, and `major.minor[.patch]` only where a
# feature or API rig relies on first appeared (each such floor says which).
# Do not raise a floor because a newer release exists — Dependabot is
# configured (`versioning-strategy: increase-if-necessary`) to move only
# `Cargo.lock` for in-range releases, and every rig release used to ship the
# raised floors, forcing downstream users to `cargo update` a dozen crates
# just to take a point release (#2195). Raise a floor when rig starts using
# an API the old floor lacks, and say so in the changelog.
# `scripts/check-dependency-floors.py` (CI: `stable / dependency floors`)
# downgrades every direct dependency to its floor and builds the workspace,
# so a floor that has silently rotted fails there rather than downstream.
#
# The `rig` facade is the workspace-root package; examples depend on it via
# `rig.workspace = true` (add per-example features at the use site).
rig = { path = ".", version = "0.46.0" }
rig-agent = { path = "crates/rig-agent", version = "0.46.0" }
rig-reqwest = { path = "crates/rig-reqwest", version = "0.46.0" }
rig-rmcp = { path = "crates/rig-rmcp", version = "0.46.0" }
rig-core = { path = "crates/rig-core", version = "0.46.0" }
anyhow = "1"
assert_fs = "1"
async-stream = "0.3"
axum = "0.8"
aws-config = { version = "1", default-features = false }
# 1.124: `OutputConfig`/`ServiceTier`/citations types rig-bedrock maps.
aws-sdk-bedrockruntime = { version = "1.124", default-features = false }
aws-smithy-eventstream = "0.61"
aws-smithy-http-client = { version = "1", default-features = false }
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
base64 = "0.23.1"
bytes = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
chrono = "0.4"
convert_case = "0.11"
# Benchmarks (`benches/`, compiled in CI, never run there). 0.1.15: timings
# net of the allocation counter (`AllocProfiler`).
divan = "0.1.15"
dotenvy = "0.15"
epub = "2"
# 4.5: the `hf-hub-*` feature split rig-fastembed forwards.
fastembed = { version = "4.5", default-features = false }
fastrand = "2"
futures = "0.3"
futures-timer = "3"
glob = "0.3"
google-cloud-auth = "1"
google-cloud-gax = "1"
# 1.7: `ThinkingLevel`, `ImageConfig`, `FunctionResponse{Blob,FileData}`.
# 1.8: `generate_content_response::UsageMetadata::tool_use_prompt_tokens_details`.
google-cloud-aiplatform-v1 = { version = "1.8", default-features = false, features = [
    "prediction-service",
] }
http = "1"
http-body = "1"
httpdate = "1"
httpmock = "0.8.2"
# Decodes the JPEG frames of rig-candle's pose test and example.
image = { version = "0.25.10", default-features = false }
indexmap = "2"
log = "0.4"
lopdf = { version = "0.44", default-features = false, features = ["rayon"] }
memchr = "2"
mime = "0.3"
mime_guess = "2"
opentelemetry = "0.32"
opentelemetry-otlp = "0.32"
opentelemetry_sdk = "0.32"
ordered-float = "5"
proc-macro2 = "1"
quick-xml = "0.41"
quote = "1"
redis = "1"
reqwest = { version = "0.13", default-features = false }
reqwest-middleware = { version = "0.5", default-features = false }
reqwest-retry = "0.9"
rmcp = "3.9"
url = "2"
schemars = "1"
serde = "1"
serde_yaml = "0.9"
# 1.0.54: the `float_roundtrip` feature.
serde_json = "1.0.54"
safetensors = "0.8"
sha2 = "0.11.1"
serde_path_to_error = "0.1"
# 0.8.3: `Engine::new_sandboxed` and the thread state controller rig-steel uses.
# At least 3.2.5: earlier releases no longer build against the newest
# `surrealdb-core` their requirement accepts.
syn = "3"
term_size = "0.3"
textwrap = "0.16"
thiserror = "2"
tokio = "1"
tokio-test = "0.4"
tokio-tungstenite = { version = "0.29", default-features = false }
tokenizers = { version = "0.22", default-features = false }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
protoc-bin-vendored = "3"
tracing = "0.1"
# 0.2.5: `Instrumented<S>: Stream` under `futures-03` for futures 0.3 stable.
tracing-futures = "0.2.5"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
uuid = "1"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
web-time = "1"
webpki-root-certs = "1"

[workspace.metadata.cargo-autoinherit]
# Skip cargo-autoinherit for these packages
exclude-members = ["crates/rig-core", "crates/rig-derive"]

[lints]
workspace = true

[lib]
name = "rig"
path = "src/lib.rs"
doctest = true

[dependencies]
async-stream = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
fastrand = { workspace = true }
futures = { workspace = true }
futures-timer = { workspace = true }
glob = { workspace = true }
http = { workspace = true }
httpdate = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
memchr = { workspace = true }
mime = { workspace = true }
mime_guess = { workspace = true }
ordered-float = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-futures = { workspace = true, features = ["futures-03"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
web-time = { workspace = true }

# Documents and books: `pdf` and `epub`.
epub = { workspace = true, optional = true }
lopdf = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }

# The bundled HTTP transport (`reqwest_client`) and its middleware selectors.
reqwest = { workspace = true, features = ["json", "stream", "multipart"], optional = true }
reqwest-middleware = { workspace = true, optional = true, features = [
  "json",
  "multipart",
  "charset",
  "http2",
] }
# The roots the shared client trusts when the system has none (`rustls`).
webpki-root-certs = { workspace = true, optional = true }

# `test-utils`: the tracing capture the telemetry contracts need.
tracing-subscriber = { workspace = true, optional = true }

# The native runtime every bundled transport and SDK provider polls its I/O in.
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread", "net", "time"] }

# AWS Bedrock (`bedrock`).
aws-config = { workspace = true, optional = true, features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = { workspace = true, optional = true, features = [
  "rt-tokio",
  "default-https-client",
] }
aws-smithy-eventstream = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true, features = ["client"] }
aws-smithy-types = { workspace = true, optional = true, features = ["http-body-1-x"] }
http-body = { workspace = true, optional = true }

# Local inference (`candle`).
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
safetensors = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true, features = ["onig"] }

# Local embeddings (`fastembed`).
fastembed = { workspace = true, optional = true }

# Gemini over gRPC (`gemini-grpc`).
prost = { workspace = true, optional = true }
prost-reflect = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
tonic = { workspace = true, optional = true, features = [
  "transport",
  "tls-ring",
  "tls-webpki-roots",
] }
tonic-prost = { workspace = true, optional = true }

# Google Vertex AI (`vertexai`).
google-cloud-aiplatform-v1 = { workspace = true, optional = true }
google-cloud-auth = { workspace = true, optional = true }
google-cloud-gax = { workspace = true, optional = true }

# MCP tool sources (`rmcp`).
rmcp = { workspace = true, optional = true, features = ["client"] }

# An `AsyncStore` over a database reaches Rig's `Files`/`Store` contracts, which
# need no driver of their own.

[build-dependencies]
protoc-bin-vendored = { workspace = true }
tonic-prost-build = { workspace = true }

# tungstenite is a native-only backend: it needs a tokio reactor, and browser
# wasm reaches websockets through `web_sys`. `ws_client` is the seam where such
# a backend plugs in.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio-tungstenite = { workspace = true, optional = true, features = [
  "connect",
  "handshake",
] }

# Browser WASM cannot select a randomness backend from the target triple alone.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
lopdf = { workspace = true, optional = true, features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
# Self-dependency: feature unification compiles the lib with `test-utils` for
# every test and example target, so the test doubles and the sequence laws
# apply in ALL of Rig's own suites while staying log-only for downstream
# builds.
rig = { path = ".", features = ["test-utils", "reqwest"] }

# Test support.
anyhow = { workspace = true }
assert_fs = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
divan = { workspace = true }
futures = { workspace = true }
httpmock = { workspace = true }
proptest = "1"
reqwest = { workspace = true, features = ["json", "stream"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# Preserve JSON object insertion order. Declare that requirement directly
# instead of inheriting it from a driver's feature graph.
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
serde_yaml = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-test = { workspace = true }
# The websocket test targets drive a local server through this backend.
tokio-tungstenite = { workspace = true, features = ["handshake"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# The examples' own dependencies.
axum = { workspace = true }
http = { workspace = true }
image = { workspace = true, features = ["jpeg", "png"] }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
redis = { workspace = true }
reqwest-middleware = { workspace = true }
reqwest-retry = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-server"] }
tracing-opentelemetry = { workspace = true }

[features]
default = ["reqwest", "rustls"]
audio = []
image = []
# The transport-agnostic websocket contract (`ws_client`). Adds no dependency,
# but stays gated so the surface is opt-in, matching `audio`/`image`.
websocket = []
test-utils = ["dep:tracing-subscriber"]
pdf = ["dep:lopdf"]
epub = ["dep:epub", "dep:quick-xml"]
# Provider clients default to the bundled reqwest transport: `OpenAI::from_env()`
# and every other client constructor that names no transport.
reqwest = [
  "dep:reqwest",
  "dep:tokio",
  "dep:webpki-root-certs",
  "dep:reqwest-middleware",
]
# `reqwest-middleware` shares its name with the optional dependency it enables
# (`dep:reqwest-middleware`); it is the spellings' common default, and the name
# the facade forwarded.
reqwest-middleware = ["reqwest-middleware-rustls"]
reqwest-middleware-rustls = ["reqwest", "dep:reqwest-middleware"]
reqwest-middleware-native-tls = ["reqwest", "dep:reqwest-middleware"]
# The bundled tungstenite websocket backend: a Responses WebSocket session
# opened with `connect()` and no backend.
websocket-backend = ["websocket", "dep:tokio-tungstenite", "dep:tokio"]
socks = ["reqwest", "reqwest/socks"]
# TLS for the bundled transports. Enable exactly one; `rustls` is the default.
rustls = [
  "dep:tokio",
  "dep:webpki-root-certs",
  "reqwest/rustls",
  "reqwest/charset",
  "reqwest/http2",
  "reqwest/system-proxy",
  "reqwest-middleware?/rustls",
  "tokio-tungstenite?/rustls-tls-webpki-roots",
]
native-tls = [
  "dep:tokio",
  "reqwest/native-tls",
  "reqwest/charset",
  "reqwest/http2",
  "reqwest/system-proxy",
  "tokio-tungstenite?/native-tls",
]
bedrock = [
  "dep:aws-config",
  "dep:aws-sdk-bedrockruntime",
  "dep:aws-smithy-eventstream",
  "dep:aws-smithy-runtime-api",
  "dep:aws-smithy-types",
  "dep:http-body",
  "dep:tokio",
  "image",
]
candle = [
  "dep:candle-core",
  "dep:candle-nn",
  "dep:candle-transformers",
  "dep:safetensors",
  "dep:tokio",
  "dep:tokenizers",
]
fastembed = ["dep:fastembed", "fastembed/hf-hub", "fastembed/ort-download-binaries"]
fastembed-hf-hub = ["dep:fastembed", "fastembed/hf-hub"]
fastembed-ort-download-binaries = ["dep:fastembed", "fastembed/ort-download-binaries"]
gemini-grpc = [
  "dep:prost",
  "dep:prost-reflect",
  "dep:prost-types",
  "dep:tonic",
  "dep:tonic-prost",
]
vertexai = [
  "dep:google-cloud-aiplatform-v1",
  "dep:google-cloud-auth",
  "dep:google-cloud-gax",
  "dep:tokio",
]
typesafeai = []
rmcp = ["dep:rmcp", "dep:tokio"]

# One binary per suite tree: each `tests/<area>/main.rs` declares its suites.
[[test]]
name = "engine"
path = "tests/engine/main.rs"

[[test]]
name = "transport"
path = "tests/transport/main.rs"

[[test]]
name = "agent"
path = "tests/agent/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "bedrock"
path = "tests/bedrock/main.rs"
required-features = ["bedrock"]

[[test]]
name = "candle"
path = "tests/candle/integration/main.rs"
required-features = ["candle"]

[[test]]
name = "gemini_grpc"
path = "tests/gemini_grpc/integration/main.rs"
required-features = ["gemini-grpc"]

[[test]]
name = "vertexai"
path = "tests/vertexai/integration/main.rs"
required-features = ["vertexai"]

[[test]]
name = "rmcp"
path = "tests/rmcp/main.rs"
required-features = ["rmcp"]

[[bench]]
name = "vector_search"
harness = false

[[bench]]
name = "session"
harness = false

# Its own process even under `cargo test`: it asserts the calling thread has no
# tokio runtime, which another suite in a shared binary could break.
[[test]]
name = "websocket_off_runtime"
required-features = ["websocket-backend"]

[[test]]
name = "off_runtime_ownership"
path = "tests/off_runtime_ownership.rs"
required-features = ["websocket-backend"]
