# Direct checks. The upstream workflow asked `cargo xtask verify` which checks
# to select from a diff; this fork's surface is a library plus its examples, so
# every lane below is one Cargo command and none needs a planner.
#
# The cassette engine has its own lane while it is still in the tree.
name: CI

on:
  pull_request:
    branches: ["**"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# One run per PR: a newer push cancels the in-flight run. Keyed on the PR
# number, not head_ref, so two forks with the same branch name do not cancel
# each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
          protoc: "true"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.repository == '0xPlaygrounds/rig' && github.event_name == 'push' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-setup
        with:
          nextest: "true"
          protoc: "true"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.repository == '0xPlaygrounds/rig' && github.event_name == 'push' }}
      - run: cargo nextest run --workspace

  # The cassette engine and the facade's cassette-backed provider suites, which
  # default features leave out.
  cassette:
    name: cassette
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-setup
        with:
          nextest: "true"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.repository == '0xPlaygrounds/rig' && github.event_name == 'push' }}
      - run: cargo nextest run -p rig-cassette
      - run: cargo nextest run -p rig --features cassette --test integration

  doctest:
    name: doctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-setup
        with:
          protoc: "true"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.repository == '0xPlaygrounds/rig' && github.event_name == 'push' }}
      - run: cargo test --workspace --doc

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-setup
        with:
          components: rust-docs
          protoc: "true"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.repository == '0xPlaygrounds/rig' && github.event_name == 'push' }}
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Each package checked on its own for the browser target: cargo unifies
  # features across packages built together, which hides a manifest that forgot
  # a feature.
  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-setup
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.repository == '0xPlaygrounds/rig' && github.event_name == 'push' }}
      - run: cargo check -p rig-core --target wasm32-unknown-unknown
      - run: cargo check -p rig-agent --target wasm32-unknown-unknown
      - run: cargo check -p rig --target wasm32-unknown-unknown
